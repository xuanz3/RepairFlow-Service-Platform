name: repairflow-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repairflow
      POSTGRES_USER: repairflow
      POSTGRES_PASSWORD: repairflow-local-only
    ports:
      - '55440:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repairflow -d repairflow']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - repairflow-postgres:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: 'azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data'
    ports:
      - '10000:10000'
      - '10001:10001'
      - '10002:10002'
    volumes:
      - repairflow-azurite:/data

  otel-collector:
    profiles: ['observability']
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - './observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro'
    ports:
      - '4317:4317'
      - '4318:4318'
      - '9464:9464'

  prometheus:
    profiles: ['observability']
    image: prom/prometheus:v3.13.1
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - './observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
    ports:
      - '9090:9090'
    depends_on:
      - otel-collector

  grafana:
    profiles: ['observability']
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '3300:3000'
    volumes:
      - './observability/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './observability/grafana/dashboards:/var/lib/grafana/dashboards:ro'
    depends_on:
      - prometheus

volumes:
  repairflow-postgres:
  repairflow-azurite:
