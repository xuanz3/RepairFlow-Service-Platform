appId: com.xuanz3.repairflow.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'mobile-home'
    timeout: 90000
- tapOn:
    id: 'mobile-new-intake'
- assertVisible: 'New repair intake'
- tapOn:
    id: 'intake-customer'
- inputText: 'Release Verification'
- tapOn:
    id: 'intake-manufacturer'
- inputText: 'Orion'
- tapOn:
    id: 'intake-model'
- inputText: 'Notebook 14'
- tapOn:
    id: 'intake-serial'
- inputText: 'RELEASE-0001'
- tapOn:
    id: 'intake-fault'
- inputText: 'Intermittent charging under connector movement.'
- tapOn:
    id: 'intake-condition'
- inputText: 'No impact damage observed at intake.'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'save-intake'
    direction: DOWN
- tapOn:
    id: 'save-intake'
- extendedWaitUntil:
    visible: 'Release Verification'
    timeout: 30000
- tapOn:
    id: 'mobile-route-back'
- extendedWaitUntil:
    visible:
      id: 'mobile-home'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'mobile-case-customer-release-verification'
    direction: DOWN
- assertVisible:
    id: 'mobile-case-customer-release-verification'
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'mobile-home'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'mobile-case-customer-release-verification'
    direction: DOWN
- assertVisible:
    id: 'mobile-case-customer-release-verification'
