name: Phase 4 Release Candidate

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.1
  PNPM_VERSION: 11.9.0

jobs:
  release-quality:
    name: Release Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: pnpm }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.302 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/mobile exec expo install --check
      - run: pnpm verify:phase4
      - run: pnpm build
      - run: pnpm --filter @repairflow/desktop exec playwright install --with-deps chromium
      - run: pnpm --filter @repairflow/desktop e2e
      - run: pnpm --filter @repairflow/desktop a11y
      - run: dotnet restore apps/api/RepairFlow.sln --locked-mode
      - run: dotnet build apps/api/RepairFlow.sln --configuration Release --no-restore
      - run: dotnet test apps/api/RepairFlow.sln --configuration Release --no-build --logger trx
      - run: docker compose -f infra/docker-compose.yml config --quiet
      - run: docker compose -f infra/docker-compose.yml --profile observability config --quiet

  desktop-package:
    name: Desktop Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, os: macos-latest, command: 'package:mac' }
          - { platform: windows, os: windows-latest, command: 'package:win' }
          - { platform: linux, os: ubuntu-latest, command: 'package:linux' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @repairflow/desktop package:prepare
      - run: node tools/verify/desktop-package-contract.mjs
      - if: matrix.platform == 'linux'
        env:
          REPAIRFLOW_RUNTIME_SMOKE: '1'
          REPAIRFLOW_RUNTIME_SMOKE_PATH: ${{ runner.temp }}/repairflow-desktop-upgrade.sqlite
        run: |
          xvfb-run -a pnpm --filter @repairflow/desktop exec electron --no-sandbox .release-package
          xvfb-run -a pnpm --filter @repairflow/desktop exec electron --no-sandbox .release-package
      - if: matrix.platform != 'linux'
        env:
          REPAIRFLOW_RUNTIME_SMOKE: '1'
          REPAIRFLOW_RUNTIME_SMOKE_PATH: ${{ runner.temp }}/repairflow-desktop-upgrade.sqlite
        run: |
          pnpm --filter @repairflow/desktop exec electron .release-package
          pnpm --filter @repairflow/desktop exec electron .release-package
      - run: pnpm --filter @repairflow/desktop ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - shell: bash
        run: |
          mkdir -p artifacts/desktop-${{ matrix.platform }}
          pick_first() {
            pattern="$1"
            selected=""
            while IFS= read -r candidate; do
              selected="$candidate"
              break
            done < <(find apps/desktop/release/desktop -type f -name "$pattern" -print | sort)
            test -n "$selected"
            printf '%s\n' "$selected"
          }
          if [ '${{ matrix.platform }}' = 'macos' ]; then cp "$(pick_first '*.zip')" artifacts/desktop-macos/RepairFlow-macOS-arm64.zip; fi
          if [ '${{ matrix.platform }}' = 'windows' ]; then cp "$(pick_first '*.exe')" artifacts/desktop-windows/RepairFlow-Windows-x64.exe; fi
          if [ '${{ matrix.platform }}' = 'linux' ]; then cp "$(pick_first '*.AppImage')" artifacts/desktop-linux/RepairFlow-Linux-x64.AppImage; fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: artifacts/desktop-${{ matrix.platform }}/*
          if-no-files-found: error

  android-package:
    name: Android Package and Offline Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Prepare Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm || true
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM acceleration is available."
            else
              echo "::warning::KVM exists but is not accessible; the emulator runner will choose its safe fallback."
            fi
          else
            echo "::warning::/dev/kvm is unavailable on this runner; the emulator runner will choose its safe fallback."
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@repairflow/mobile
      - run: pnpm --dir apps/mobile native:android
      - working-directory: apps/mobile/android
        run: ./gradlew assembleRelease
      - run: mkdir -p artifacts/android && cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/android/RepairFlow-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          {
            name: mobile-android,
            path: artifacts/android/RepairFlow-Android.apk,
            if-no-files-found: error,
          }
      - name: Run Android release smoke and capture offline queue
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
          MAESTRO_DIAGNOSTIC_DIR: artifacts/diagnostics/android
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb install -r artifacts/android/RepairFlow-Android.apk
            curl -fLsS -o /tmp/install-maestro.sh https://get.maestro.mobile.dev
            bash /tmp/install-maestro.sh
            test -x "$HOME/.maestro/bin/maestro"
            mkdir -p artifacts/media/android
            bash scripts/run-maestro-with-retry.sh test apps/mobile/maestro/release-smoke.yaml
            bash scripts/run-maestro-with-retry.sh test --test-output-dir artifacts/media/android apps/mobile/maestro/release-media-android.yaml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          {
            name: diagnostics-android,
            path: artifacts/diagnostics/android/**,
            if-no-files-found: ignore,
          }
      - uses: actions/upload-artifact@v4
        with: { name: media-android, path: artifacts/media/android/**, if-no-files-found: error }

  ios-package:
    name: iOS Simulator Package and Media
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@repairflow/mobile
      - run: pnpm --dir apps/mobile native:ios
      - working-directory: apps/mobile/ios
        run: pod install
      - name: Build iOS Simulator release
        working-directory: apps/mobile
        run: |
          xcodebuild -workspace ios/RepairFlow.xcworkspace -scheme RepairFlow -configuration Release -sdk iphonesimulator -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          APP_REL=""
          while IFS= read -r candidate; do
            APP_REL="$candidate"
            break
          done < <(find build/ios/Build/Products -maxdepth 2 -type d -name 'RepairFlow.app' -print | sort)
          test -n "$APP_REL"
          APP_PATH="$PWD/$APP_REL"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../../RepairFlow-iOS-Simulator.zip
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
      - run: mkdir -p artifacts/ios && mv RepairFlow-iOS-Simulator.zip artifacts/ios/
      - name: Install and capture iOS release
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
          MAESTRO_DIAGNOSTIC_DIR: artifacts/diagnostics/ios
        run: |
          DEVICE="$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          for runtime,devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if d['name'].startswith('iPhone'):
                          print(d['udid']); raise SystemExit
          raise SystemExit('No available iPhone simulator')
          PY
          )"
          export MAESTRO_IOS_UDID="$DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          open -a Simulator
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl privacy "$DEVICE" grant camera com.xuanz3.repairflow.mobile || true
          curl -fLsS -o /tmp/install-maestro.sh https://get.maestro.mobile.dev
          bash /tmp/install-maestro.sh
          test -x "$HOME/.maestro/bin/maestro"
          mkdir -p artifacts/media/ios
          bash scripts/run-maestro-with-retry.sh test apps/mobile/maestro/release-smoke.yaml
          bash scripts/run-maestro-with-retry.sh test --test-output-dir artifacts/media/ios apps/mobile/maestro/release-media-ios.yaml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          { name: diagnostics-ios, path: artifacts/diagnostics/ios/**, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with:
          {
            name: mobile-ios-simulator,
            path: artifacts/ios/RepairFlow-iOS-Simulator.zip,
            if-no-files-found: error,
          }
      - uses: actions/upload-artifact@v4
        with: { name: media-ios, path: artifacts/media/ios/**, if-no-files-found: error }

  desktop-media:
    name: Desktop Product Media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @repairflow/desktop exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm --filter @repairflow/desktop exec playwright test --config=playwright.media.config.ts
        env:
          REPAIRFLOW_MEDIA_OUTPUT: ${{ github.workspace }}/artifacts/media/desktop
      - uses: actions/upload-artifact@v4
        with: { name: media-desktop, path: artifacts/media/desktop/*.png, if-no-files-found: error }

  diagrams:
    name: Architecture Media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1 }
      - run: |
          mkdir -p artifacts/media/diagrams
          PUPPETEER_SKIP_DOWNLOAD=true npx -y @mermaid-js/mermaid-cli@11.16.0 -p tools/media/puppeteer-config.json -i tools/media/system-architecture.mmd -o artifacts/media/diagrams/15-system-architecture.png -w 1400 -H 700 -b '#ffffff'
          PUPPETEER_SKIP_DOWNLOAD=true npx -y @mermaid-js/mermaid-cli@11.16.0 -p tools/media/puppeteer-config.json -i tools/media/synchronisation-sequence.mmd -o artifacts/media/diagrams/16-synchronisation-sequence.png -w 1400 -H 700 -b '#ffffff'
      - uses: actions/upload-artifact@v4
        with:
          { name: media-diagrams, path: artifacts/media/diagrams/*.png, if-no-files-found: error }

  aggregate-release:
    name: Aggregate Release Bundle and Product Media
    runs-on: ubuntu-latest
    needs: [release-quality, desktop-package, android-package, ios-package, desktop-media, diagrams]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { path: artifacts/downloads }
      - name: Assemble raw media and release files
        run: |
          mkdir -p artifacts/media/raw/{desktop,ios,android,diagrams} artifacts/release-bundle
          find artifacts/downloads/media-desktop -type f -name '*.png' -exec cp {} artifacts/media/raw/desktop/ \;
          find artifacts/downloads/media-ios -type f -name '*.png' -exec cp {} artifacts/media/raw/ios/ \;
          find artifacts/downloads/media-android -type f -name '*.png' -exec cp {} artifacts/media/raw/android/ \;
          find artifacts/downloads/media-diagrams -type f -name '*.png' -exec cp {} artifacts/media/raw/diagrams/ \;
          find artifacts/downloads/desktop-macos -type f -name '*.zip' -exec cp {} artifacts/release-bundle/RepairFlow-macOS-arm64.zip \;
          find artifacts/downloads/desktop-windows -type f -name '*.exe' -exec cp {} artifacts/release-bundle/RepairFlow-Windows-x64.exe \;
          find artifacts/downloads/desktop-linux -type f -name '*.AppImage' -exec cp {} artifacts/release-bundle/RepairFlow-Linux-x64.AppImage \;
          find artifacts/downloads/mobile-android -type f -name '*.apk' -exec cp {} artifacts/release-bundle/RepairFlow-Android.apk \;
          find artifacts/downloads/mobile-ios-simulator -type f -name '*.zip' -exec cp {} artifacts/release-bundle/RepairFlow-iOS-Simulator.zip \;
      - run: node tools/media/compose-final-media.mjs artifacts/media/raw artifacts/media/final
      - run: node tools/release/build-metadata.mjs artifacts/release-bundle
      - run: node tools/release/generate-sbom.mjs artifacts/release-bundle
      - run: cp docs/releases/KNOWN_LIMITATIONS_V1.md artifacts/release-bundle/KNOWN_LIMITATIONS.md && cp docs/releases/v1.0.0.md artifacts/release-bundle/RELEASE_NOTES.md
      - run: node tools/release/generate-checksums.mjs artifacts/release-bundle
      - run: node tools/verify/release-bundle-contract.mjs artifacts/release-bundle
      - run: |
          test "$(find artifacts/media/final -type f -name '*.png' | wc -l | tr -d ' ')" = 18
          test "$(find artifacts/release-bundle -maxdepth 1 -type f | wc -l | tr -d ' ')" -ge 9
      - uses: actions/upload-artifact@v4
        with:
          {
            name: phase4-product-media,
            path: artifacts/media/final/*.png,
            if-no-files-found: error,
          }
      - uses: actions/upload-artifact@v4
        with:
          {
            name: repairflow-release-bundle,
            path: artifacts/release-bundle/*,
            if-no-files-found: error,
          }
