name: Platform Foundation

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'global.json'
      - '.github/workflows/platform-foundation.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-quality:
    name: Workspace Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: python3 scripts/validate_repository.py
      - run: python3 scripts/validate_phase1.py
      - run: python3 scripts/validate_framework_gates.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/mobile exec expo install --check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  service-quality:
    name: Service Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: 'apps/api/**/packages.lock.json'
      - run: dotnet restore apps/api/RepairFlow.sln --locked-mode
      - run: dotnet build apps/api/RepairFlow.sln --configuration Release --no-restore
      - run: dotnet test apps/api/RepairFlow.sln --configuration Release --no-build --logger trx

  shell-builds:
    name: Client Shells (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repairflow/contracts build
      - run: pnpm --filter @repairflow/design-tokens build
      - run: pnpm --filter @repairflow/api-client build
      - run: pnpm --filter @repairflow/desktop typecheck
      - run: pnpm --filter @repairflow/desktop build
      - run: pnpm --filter @repairflow/mobile typecheck

  compose-contract:
    name: Local Service Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml config --quiet
