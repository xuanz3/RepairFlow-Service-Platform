name: Synchronisation Reliability

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/**'
      - 'infra/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/phase3-reliability.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-quality:
    name: Reliability Workspace Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/mobile exec expo install --check
      - run: pnpm verify:phase3

  service-reliability:
    name: Service Reliability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: 'apps/api/**/packages.lock.json'
      - run: dotnet restore apps/api/RepairFlow.sln --locked-mode
      - run: dotnet build apps/api/RepairFlow.sln --configuration Release --no-restore
      - run: dotnet test apps/api/RepairFlow.sln --configuration Release --no-build --logger trx

  recovery-and-performance:
    name: Failure Recovery and Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:failure
      - run: mkdir -p artifacts && PHASE3_METRICS_OUTPUT=artifacts/phase3-sync-performance.json pnpm measure:sync
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-sync-performance
          path: artifacts/phase3-sync-performance.json
          if-no-files-found: error

  desktop-shells:
    name: Reliability Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck build --filter=@repairflow/desktop

  infrastructure-contract:
    name: Observability Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml config --quiet
      - run: docker compose -f infra/docker-compose.yml --profile observability config --quiet
      - run: python3 -m json.tool infra/observability/grafana/dashboards/repairflow-sync-reliability.json >/dev/null
